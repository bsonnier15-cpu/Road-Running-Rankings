name: Nightly sync and deploy

on:
  schedule:
    - cron: "17 8 * * *"   # 3:17am Central, after most weekend results post
  workflow_dispatch:
    inputs:
      days:
        description: "Days of results to pull (use 365 for a full backfill)"
        default: "14"
              states:
        description: "States to sync, separated by spaces, e.g. TX LA (leave blank for all)"
        default: ""
              

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync RunSignup results
        env:
          RSU_API_KEY: ${{ secrets.RSU_API_KEY }}
          RSU_API_SECRET: ${{ secrets.RSU_API_SECRET }}
          RSU_API_REG: ${{ secrets.RSU_API_REG }}
          RSU_API_REG_SECRET: ${{ secrets.RSU_API_REG_SECRET }}
        run: python -m rankings.sync --days "${{ github.event.inputs.days || '14' }}" ${{ github.event.inputs.states && format('--states {0}', github.event.inputs.states) || '' }}
        run: python -m rankings.build

      - name: Commit database
        run: |
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add data/rankings.db
          git diff --cached --quiet || git commit -m "Nightly sync $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
