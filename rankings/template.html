<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__SITE_NAME__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* VOICE: race-morning energy, proud of the home state, precise about the numbers.
   IDEA: a finish-line results board hung in front of the state flag.
   PICTURE: the state flag fills the hero; the top three are printed race bibs.
   COLOUR and TYPE: the flag's own colours lead; bib-number condensed caps + Plex for data.
   LAYOUT: hero with title and stats over the flag, bib podium, ranked board, state grid. */
:root {
  color-scheme: light dark;
  --st-field: #002868;
  --st-accent: #BF0A30;
  --bg: light-dark(#F4F6F5, #0D1312);
  --surface: light-dark(#FFFFFF, #141C1B);
  --ink: light-dark(#121A19, #E9EFEE);
  --muted: light-dark(#56635F, #97A6A2);
  --line: light-dark(#DDE3E1, #25302E);
  --accent: light-dark(var(--st-accent), color-mix(in srgb, var(--st-accent) 55%, #FFFFFF));
  --accent-soft: light-dark(color-mix(in srgb, var(--st-accent) 10%, #FFFFFF), color-mix(in srgb, var(--st-accent) 22%, #0D1312));
  --night: color-mix(in srgb, var(--st-field) 45%, #050A0A);
  --btn: color-mix(in srgb, var(--st-accent) 82%, #000000);
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; min-width: 0; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); overflow-x: clip; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
a { color: inherit; }
button, select { font: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Hero: the flag */
.hero { position: relative; isolation: isolate; overflow: hidden; background: var(--night); color: #FFFFFF; }
.hero .flag { position: absolute; inset: 0; z-index: -2; }
.hero .flag svg { width: 100%; height: 100%; display: block; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(100deg, color-mix(in srgb, var(--night) 92%, transparent) 0%, color-mix(in srgb, var(--night) 70%, transparent) 38%, color-mix(in srgb, var(--night) 12%, transparent) 72%, transparent),
              linear-gradient(0deg, color-mix(in srgb, var(--night) 60%, transparent), transparent 40%); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-block: 18px; }
.mark { display: flex; align-items: center; gap: 10px; font: 800 26px/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; text-decoration: none; }
.mark svg { width: 30px; height: 30px; }
.pick { display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 14px; border-radius: 12px; background: color-mix(in srgb, var(--night) 80%, transparent); }
.pick label { font-size: 14px; }
.pick select { min-height: 44px; font-size: 16px; padding: 8px 12px; border-radius: 8px; color: #FFFFFF; border: 1px solid rgba(255,255,255,0.35); background: color-mix(in srgb, var(--night) 75%, transparent); }
.pick select option { color: #121A19; background: #FFFFFF; }
.herobody { display: grid; gap: 18px; padding-block: clamp(28px, 6vw, 72px) clamp(26px, 4vw, 44px); text-shadow: 0 2px 18px rgba(0,0,0,0.35); }
.hero h1 { margin: 0; font: 800 clamp(52px, 10vw, 112px)/0.92 var(--display); text-transform: uppercase; letter-spacing: -0.005em; text-wrap: balance; max-width: 11ch; }
.hero .sub { margin: 0; max-width: 46ch; font-size: 17px; opacity: 0.92; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.stat { display: grid; padding: 10px 16px; border-radius: 10px; background: color-mix(in srgb, var(--night) 62%, transparent); border: 1px solid rgba(255,255,255,0.18); backdrop-filter: blur(4px); text-shadow: none; }
.stat b { font: 700 28px/1.05 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; opacity: 0.8; }

.sample { background: var(--accent-soft); font-size: 14px; }
.sample .wrap { padding-block: 9px; }

/* Controls */
.controls { display: flex; gap: 12px 16px; flex-wrap: wrap; align-items: center; padding-block: 28px 8px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 44px; border: 0; background: transparent; color: var(--muted); padding: 0 16px; font-weight: 600; font-size: 15px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--btn); color: #FFFFFF; }
.seg button:hover:not([aria-pressed="true"]) { color: var(--ink); }
.explain { color: var(--muted); font-size: 15px; max-width: 72ch; margin: 6px 0 22px; }

/* Podium: race bibs */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-bottom: 26px; }
.bib { position: relative; background: #FFFFFF; color: #121A19; border-radius: 10px; overflow: hidden;
  box-shadow: 0 1px 0 rgba(0,0,0,0.06), 0 10px 26px -14px rgba(0,0,0,0.35); border: 1px solid rgba(0,0,0,0.08); }
.bib .band { background: var(--btn); color: #FFFFFF; padding: 9px 30px; font: 700 15px/1.2 var(--display); text-transform: uppercase; letter-spacing: 0.04em; display: flex; justify-content: space-between; gap: 8px; }
.bib .pin { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #D7DBDA; box-shadow: inset 0 1px 2px rgba(0,0,0,0.35); }
.bib .pin.tl { top: 13px; left: 11px; } .bib .pin.tr { top: 13px; right: 11px; }
.bib .pin.bl { bottom: 11px; left: 11px; } .bib .pin.br { bottom: 11px; right: 11px; }
.bib .body { padding: 10px 26px 24px; display: grid; gap: 2px; }
.bib .num { font: 800 84px/0.95 var(--display); color: var(--st-field); font-variant-numeric: tabular-nums; }
.bib .who { font-weight: 600; font-size: 19px; line-height: 1.25; }
.bib .city { color: #56635F; font-size: 14px; }
.bib .metric { margin-top: 10px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.bib .metric b { font: 500 24px var(--mono); font-variant-numeric: tabular-nums; }
.bib .metric span { color: #56635F; font-size: 13px; }
.bib .race { color: #56635F; font-size: 13px; margin-top: 4px; }
.bib .src { margin-left: 0; }
.bib .src.on { color: var(--st-accent); }

/* Board */
.board { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 56px; }
.board table { width: 100%; border-collapse: collapse; }
.board th { font-size: 13px; font-weight: 600; color: var(--muted); text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.board td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
.board tr:last-child td { border-bottom: 0; }
.board th.r, .board td.r { text-align: right; }
.rk { width: 64px; font: 700 26px/1.1 var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.name b { display: block; font-weight: 600; }
.name small { color: var(--muted); font-size: 14px; }
.t { font: 500 16px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.racecell { font-size: 14px; color: var(--muted); }
.racecell b { display: block; color: var(--ink); font-weight: 500; }
.bar { display: block; height: 5px; border-radius: 3px; background: var(--line); margin-top: 7px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.more { display: inline-flex; align-items: center; min-height: 32px; padding: 0; margin-top: 2px; background: none; border: 0; color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; }
.counting { list-style: none; margin: 6px 0 2px; padding: 0; display: grid; gap: 8px; font-size: 14px; color: var(--muted); }
.counting li { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.tag { font: 700 13px/1.4 var(--display); text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; }
.src { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; margin-left: 4px; }
a.src:hover { text-decoration: underline; }
.src.off { color: var(--muted); cursor: help; }
.empty { padding: 48px 24px; text-align: center; color: var(--muted); }

/* State grid */
.states h2 { font: 800 34px/1.05 var(--display); text-transform: uppercase; margin: 0 0 6px; }
.states p { margin: 0 0 18px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; margin-bottom: 56px; }
.chip { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; font-size: 15px; }
.chip svg { flex: none; width: 36px; height: 24px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,0.12); }
.chip:hover { border-color: var(--accent); }
.chip[aria-current="page"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600; }
.chip .dim { color: var(--muted); }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
footer .wrap { padding-block: 22px 40px; display: grid; gap: 6px; max-width: 1180px; }

@media (max-width: 860px) {
  .podium { grid-template-columns: minmax(0, 1fr); }
  .bib .body { grid-template-columns: auto 1fr; column-gap: 18px; }
  .bib .num { grid-row: span 4; font-size: 72px; }
}
@media (max-width: 600px) {
  .pick label { display: none; }
  .pick { padding: 0; background: none; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stat { padding: 8px 10px; }
  .stat b { font-size: 24px; }
  .stat span { font-size: 12px; line-height: 1.3; }
  .hero::after { background: color-mix(in srgb, var(--night) 72%, transparent); }
  .hide-sm { display: none; }
  .board td, .board th { padding: 10px 12px; }
  .rk { width: 44px; font-size: 22px; }
}
@media (prefers-reduced-motion: no-preference) {
  .hero .flag { animation: wave 700ms ease-out both; }
  @keyframes wave { from { opacity: 0.35; transform: scale(1.04); } }
}
</style>
</head>
<body>
<header class="hero">
  <div class="flag" id="flag" aria-hidden="true"></div>
  <div class="wrap topbar">
    <a class="mark" href="#" id="home">
      <svg viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="6" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M8 21 L13 12 L17 17 L22 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="siteName">__SITE_NAME__</span>
    </a>
    <div class="pick">
      <label for="statePick">Choose a state</label>
      <select id="statePick"></select>
    </div>
  </div>
  <div class="wrap herobody">
    <h1 id="pageName">The Texas 50</h1>
    <p class="sub" id="pageSub"></p>
    <div class="stats" id="stats"></div>
  </div>
</header>
<div class="sample" id="sampleNote" hidden><div class="wrap">Sample data for previewing the design. These runners and races are invented. Real rankings appear after the first RunSignup sync.</div></div>

<main class="wrap">
  <div class="controls">
    <div class="seg" role="group" aria-label="Ranking type" id="viewSeg">
      <button type="button" data-view="power" aria-pressed="true">Power Rankings</button>
      <button type="button" data-view="top" aria-pressed="false">Top Times</button>
    </div>
    <div class="seg" role="group" aria-label="Gender" id="genderSeg">
      <button type="button" data-g="M" aria-pressed="true">Men</button>
      <button type="button" data-g="F" aria-pressed="false">Women</button>
    </div>
    <div class="seg" role="group" aria-label="Distance" id="distSeg" hidden></div>
  </div>
  <p class="explain" id="explain"></p>
  <section class="podium" id="podium" aria-label="Top three"></section>
  <div class="board" id="boardWrap"><table id="tbl"></table></div>

  <section class="states" aria-labelledby="statesHead">
    <h2 id="statesHead">Every state</h2>
    <p>Fifty states, fifty rankings. Pick one to see its fastest runners.</p>
    <nav class="grid" id="grid" aria-label="States"></nav>
  </section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
/*__FLAGS__*/
const DATA = /*__DATA__*/null;
{
const S = { st: "TX", view: "power", g: "M", dist: "5k", open: new Set() };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = sec => { const s = Math.round(sec), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return h ? `${h}:${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}` : `${m}:${String(r).padStart(2, "0")}`; };
const fdate = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const stName = c => DATA.states[c];
const pageName = c => DATA.meta.statePage.replace("{state}", stName(c));
const flagSvg = (c, ratio) => FLAGS[c] ? `<svg viewBox="0 0 300 200" preserveAspectRatio="${ratio}" xmlns="http://www.w3.org/2000/svg">${FLAGS[c].draw()}</svg>` : "";
const hasData = c => !!(DATA.power[c] || DATA.top[c]);
const distLabel = k => DATA.distances[k] === "Half Marathon" ? "Half" : DATA.distances[k];

function src(rid) {
  if (!rid) return "";
  if (DATA.meta.sample) return `<span class="src off" title="Sample race: no real results page">Official results</span>`;
  return `<a class="src on" href="https://runsignup.com/Race/Results/${encodeURIComponent(rid)}" target="_blank" rel="noopener">Official results<span aria-hidden="true"> ↗</span></a>`;
}

function init() {
  const codes = Object.keys(DATA.states);
  $("sampleNote").hidden = !DATA.meta.sample;
  $("statePick").innerHTML = codes.map(c => `<option value="${c}">${esc(stName(c))}</option>`).join("");
  $("distSeg").innerHTML = Object.keys(DATA.distances).map(k =>
    `<button type="button" data-d="${k}" aria-pressed="${k === S.dist}">${esc(distLabel(k))}</button>`).join("");
  $("grid").innerHTML = codes.map(c =>
    `<a class="chip" href="#${c.toLowerCase()}" data-st="${c}">${flagSvg(c, "xMidYMid slice")}<span>${esc(stName(c))}${hasData(c) ? "" : ' <span class="dim">· soon</span>'}</span></a>`).join("");
  $("foot").innerHTML = `<div><b>${esc(DATA.meta.site)}</b>: ${esc(DATA.meta.tagline)}.</div>
    <div>Rankings cover the last 12 months of official results from RunSignup races. Runners are ranked in their home state, not where the race was held. Every result links to its official results page.</div>
    ${DATA.meta.lastSync ? `<div>Last updated ${fdate(DATA.meta.lastSync.slice(0, 10))}.</div>` : ""}`;

  const fallback = hasData("TX") ? "TX" : codes.find(hasData) || "TX";
  const fromHash = () => { const h = location.hash.slice(1).toUpperCase(); S.st = DATA.states[h] ? h : fallback; S.open.clear(); render(); };
  window.addEventListener("hashchange", () => { fromHash(); window.scrollTo({ top: 0 }); });
  $("statePick").addEventListener("change", e => { location.hash = e.target.value.toLowerCase(); });
  $("home").addEventListener("click", e => { e.preventDefault(); location.hash = fallback.toLowerCase(); });
  seg("viewSeg", "view", v => (S.view = v));
  seg("genderSeg", "g", v => (S.g = v));
  seg("distSeg", "d", v => (S.dist = v));
  $("tbl").addEventListener("click", e => {
    const b = e.target.closest("[data-open]"); if (!b) return;
    const k = b.dataset.open; S.open.has(k) ? S.open.delete(k) : S.open.add(k); render();
  });
  fromHash();
}
function seg(id, attr, set) {
  $(id).addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    set(b.dataset[attr]); S.open.clear();
    $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
    render();
  });
}

function theme() {
  const f = FLAGS[S.st]; if (!f) return;
  const r = document.documentElement.style;
  r.setProperty("--st-field", f.field);
  r.setProperty("--st-accent", f.accent);
  $("flag").innerHTML = flagSvg(S.st, "xMidYMid slice");
}

function render() {
  if (render.st !== S.st) { theme(); render.st = S.st; }
  const name = pageName(S.st), st = DATA.stats[S.st];
  document.title = `${name} · ${DATA.meta.site}`;
  $("pageName").textContent = name;
  $("pageSub").textContent = `The fastest road runners in ${stName(S.st)} over the last 12 months, ranked from official race results.`;
  $("stats").innerHTML = st
    ? `<div class="stat"><b>${st.runners.toLocaleString()}</b><span>runners with results</span></div>
       <div class="stat"><b>${st.races.toLocaleString()}</b><span>races counted</span></div>
       <div class="stat"><b>5</b><span>distances, 5K to marathon</span></div>`
    : `<div class="stat"><b>Coming soon</b><span>No results synced for ${esc(stName(S.st))} yet</span></div>`;
  $("statePick").value = S.st;
  $("distSeg").hidden = S.view !== "top";
  document.querySelectorAll(".chip").forEach(c =>
    c.dataset.st === S.st ? c.setAttribute("aria-current", "page") : c.removeAttribute("aria-current"));
  S.view === "power" ? renderPower() : renderTop();
}

function bib(rank, name, city, metric, unit, raceLine) {
  return `<article class="bib"><i class="pin tl"></i><i class="pin tr"></i><i class="pin bl"></i><i class="pin br"></i>
    <div class="band"><span>${esc(pageName(S.st))}</span><span>${S.g === "M" ? "Men" : "Women"}</span></div>
    <div class="body"><div class="num">${rank}</div><div class="who">${esc(name)}</div><div class="city">${esc(city)}</div>
    <div class="metric"><b>${metric}</b><span>${unit}</span></div><div class="race">${raceLine}</div></div></article>`;
}

function renderPower() {
  $("explain").textContent = "Power Score blends each runner's three best races at any distance, weighted 50, 30 and 20 percent. Bigger fields and beating other strong runners earn extra credit, so runners who race well against good competition rise to the top.";
  const rows = DATA.power[S.st]?.[S.g] || [];
  if (!rows.length) return empty();
  $("podium").innerHTML = rows.slice(0, 3).map(([name, city, score, races, counting], i) => {
    const [d, sec, race, date, , rid] = counting[0];
    return bib(i + 1, name, city, score.toFixed(1), "power score", `Best: ${esc(distLabel(d))} ${fmt(sec)} at ${esc(race)} ${src(rid)}`);
  }).join("");
  const max = rows[0][2];
  $("tbl").innerHTML = `<thead><tr><th>Rank</th><th>Runner</th><th class="r">Power score</th><th class="r hide-sm">Races</th></tr></thead><tbody>` +
    rows.slice(3).map(([name, city, score, races, counting], j) => {
      const i = j + 3, k = `${S.st}${S.g}${i}`, open = S.open.has(k);
      return `<tr><td class="rk">${i + 1}</td>
        <td class="name"><b>${esc(name)}</b><small>${esc(city)}</small><br>
          <button type="button" class="more" data-open="${k}" aria-expanded="${open}">${open ? "Hide races" : "Show counting races"}</button>
          ${open ? `<ul class="counting">${counting.map(([d, sec, race, date, pts, rid]) =>
            `<li><span class="tag">${esc(distLabel(d))}</span><span class="t">${fmt(sec)}</span><span>${esc(race)}, ${fdate(date)}</span>${src(rid)}</li>`).join("")}</ul>` : ""}</td>
        <td class="r"><span class="t">${score.toFixed(1)}</span><span class="bar" aria-hidden="true"><i style="width:${(score / max * 100).toFixed(1)}%"></i></span></td>
        <td class="r t hide-sm">${races}</td></tr>`;
    }).join("") + "</tbody>";
  $("boardWrap").hidden = rows.length <= 3;
}

function renderTop() {
  $("explain").textContent = `Each runner's single fastest ${DATA.distances[S.dist].replace(/Marathon/, "marathon").replace(/Half/, "half")} in the last 12 months, using chip time when the race reports it.`;
  const rows = DATA.top[S.st]?.[S.dist]?.[S.g] || [];
  if (!rows.length) return empty();
  $("podium").innerHTML = rows.slice(0, 3).map(([name, city, sec, race, date, rid], i) =>
    bib(i + 1, name, city, fmt(sec), distLabel(S.dist), `${esc(race)}, ${fdate(date)} ${src(rid)}`)).join("");
  $("tbl").innerHTML = `<thead><tr><th>Rank</th><th>Runner</th><th class="r">Time</th><th class="hide-sm">Race</th></tr></thead><tbody>` +
    rows.slice(3).map(([name, city, sec, race, date, rid], j) =>
      `<tr><td class="rk">${j + 4}</td>
        <td class="name"><b>${esc(name)}</b><small>${esc(city)}</small></td>
        <td class="r t">${fmt(sec)}</td>
        <td class="racecell hide-sm"><b>${esc(race)}</b>${fdate(date)} ${src(rid)}</td></tr>`).join("") + "</tbody>";
  $("boardWrap").hidden = rows.length <= 3;
}

function empty() {
  $("podium").innerHTML = "";
  $("boardWrap").hidden = false;
  $("tbl").innerHTML = `<tbody><tr><td class="empty">No ranked results for ${esc(stName(S.st))} yet. This page fills in automatically as ${esc(stName(S.st))} races post results to RunSignup.</td></tr></tbody>`;
}

init();
}
</script>
</body>
</html>
